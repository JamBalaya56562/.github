name: Check Conventional Commit

# Validates commit messages against the Conventional Commits specification
# (https://www.conventionalcommits.org/). On pull_request events:
#   - Failure → post (or update) the failure comment.
#   - Success after a prior failure → update the existing comment to "passed
#     (failure resolved)".
#   - Success on a clean PR (no prior failure comment) → stay quiet, no
#     comment is created. The check status itself is the signal.
# This avoids the "✅ Commitlint passed" noise on every PR that never
# failed in the first place.
#
# Triggers:
#   - push / workflow_dispatch on this repo: validates the last commit.
#   - pull_request on this repo: validates all commits in the PR.
#   - workflow_call: invoked by caller workflows in other aletheia-works repos:
#
#       jobs:
#         check:
#           uses: aletheia-works/.github/.github/workflows/commitlint.yml@main
#
#     Callers must grant contents:read and pull-requests:write permissions.

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    # Skip Sapling-managed internal PR archive branches.
    if: startsWith(github.ref_name, 'sapling-pr-archive-') == false

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install commitlint
        run: bun add -d @commitlint/cli @commitlint/config-conventional

      - name: Create commitlint config
        run: |
          cat > commitlint.config.ts <<'EOF'
          export default {
            extends: ["@commitlint/config-conventional"],
            ignores: [(message: string) => message.includes("Signed-off-by: dependabot[bot]")],
          };
          EOF

      - name: Validate last commit (push / workflow_dispatch)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: bun commitlint --last --verbose

      - name: Validate PR commits
        id: result
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bun commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose \
            &> >(tee commitlint.log) || STATUS=$?
          if [ "${STATUS:-0}" -ne 0 ]; then
            echo "is_success=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_success=true" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      # Mirror failure details into the run's Step Summary so fork-PR
      # authors can read them on the Actions tab. Fork PRs downgrade
      # GITHUB_TOKEN to read-only regardless of `permissions:`, so the
      # `Post PR comment` step below skips on forks; without this
      # fallback there would be no surface for the failure log on a
      # fork PR. Stay quiet on success to mirror the comment-side
      # behaviour — the green check is already the success signal.
      - name: Write commitlint result to Step Summary
        if: always() && github.event_name == 'pull_request' && steps.result.outputs.is_success == 'false'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha="${HEAD_SHA:0:7}"
          {
            echo '## ❌ Commitlint failed'
            echo
            echo "@${ACTOR}, commit \`${sha}\` in this PR did not satisfy the Conventional Commits rules."
            echo
            echo '<details>'
            echo '<summary>Commitlint log</summary>'
            echo
            echo '```'
            if [ -f commitlint.log ]; then
              # Same 55 KB cap as the PR-comment step.
              head -c 55000 commitlint.log
              if [ "$(wc -c < commitlint.log)" -gt 55000 ]; then
                echo
                echo '...(output truncated)...'
              fi
            else
              echo '(commitlint.log was not produced — see earlier steps)'
            fi
            echo '```'
            echo
            echo '</details>'
            echo
            echo 'Please update the commit messages to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/).'
            echo
            echo "[View the full workflow run](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post PR comment
        # Skip on fork PRs: `pull_request` from a fork downgrades
        # GITHUB_TOKEN to read-only regardless of the `permissions:`
        # block, so `issues/comments` POST 403s. The Step Summary above
        # carries the same failure content for fork-PR authors.
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          IS_SUCCESS: ${{ steps.result.outputs.is_success }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');

            const isSuccess = process.env.IS_SUCCESS === 'true';
            const marker = `<!-- generated-comment [${context.workflow}] -->`;
            const sha = process.env.HEAD_SHA.slice(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Look up any prior commitlint comment first — we need it both
            // for the skip-on-clean-success decision below and for the
            // update-vs-create branch later.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find(
              c => c.user.type === 'Bot' && c.body.includes(marker),
            );

            // Stay quiet when commitlint has been passing the whole time:
            // only post the success comment when we are flipping a prior
            // failure to success. The check status itself is the success
            // signal on a clean PR.
            if (isSuccess && !previous) {
              core.info('Commitlint passed and no prior comment exists; skipping success comment.');
              return;
            }

            let body;
            if (isSuccess) {
              body = [
                '## ✅ Commitlint passed',
                '',
                'Earlier commitlint failure on this PR has been resolved — all commits now follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/).',
                '',
                marker,
              ].join('\n');
            } else {
              let log = '';
              try {
                log = fs.readFileSync('commitlint.log', 'utf8');
              } catch (e) { /* log missing */ }
              const maxLogLength = 55000;
              const truncated = log.length > maxLogLength
                ? log.slice(0, maxLogLength) + '\n\n...(output truncated)...'
                : log;
              body = [
                '## ❌ Commitlint failed',
                '',
                `@${context.actor}, commit \`${sha}\` in this PR did not satisfy the Conventional Commits rules.`,
                '',
                '<details>',
                '<summary>Commitlint log</summary>',
                '',
                '```',
                truncated,
                '```',
                '',
                '</details>',
                '',
                'Please update the commit messages to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/).',
                `[View the full workflow run](${runUrl})`,
                '',
                marker,
              ].join('\n');
            }

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if commitlint failed
        if: steps.result.outputs.is_success == 'false'
        run: exit 1
