name: Release the reusable workflows

# Cuts a vX.Y.Z tag and a GitHub release whenever a reusable workflow
# changes on main, so caller repositories can pin `@<sha> # vX.Y.Z` and
# let Dependabot move the pin. Dependabot follows tags, not branches, so
# a `# main` comment beside a SHA is one it can never update.
#
# The version comes from the Conventional Commits types since the last
# tag: a breaking change bumps major, feat bumps minor, anything else —
# a fix, a Dependabot bump of an action inside a reusable — bumps
# patch. With no v* tag yet, the first release is v1.0.0.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/commitlint.yml'
      - '.github/workflows/terraform-apply.yml'
      - '.github/workflows/terraform-autofix.yml'
      - '.github/workflows/terraform-plan.yml'
      - '.github/workflows/terraform-state-backup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Pick the next version
        id: version
        run: |
          set -euo pipefail
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -z "$last" ]; then
            echo "next=v1.0.0" >> "$GITHUB_OUTPUT"
            echo "No v* tag yet; starting at v1.0.0"
            exit 0
          fi
          if [ "$(git rev-parse "$last")" = "$(git rev-parse HEAD)" ]; then
            echo "next=" >> "$GITHUB_OUTPUT"
            echo "HEAD is already tagged $last; nothing to release"
            exit 0
          fi
          messages="$(git log --format='%s%n%b' "$last..HEAD")"
          IFS=. read -r major minor patch <<< "${last#v}"
          if printf '%s\n' "$messages" | grep -Eq '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE:'; then
            next="v$((major + 1)).0.0"
          elif printf '%s\n' "$messages" | grep -Eq '^feat(\([^)]*\))?:'; then
            next="v$major.$((minor + 1)).0"
          else
            next="v$major.$minor.$((patch + 1))"
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "$last -> $next"

      - name: Tag and release
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          gh release create "$NEXT" \
            --target "$GITHUB_SHA" \
            --title "$NEXT" \
            --generate-notes
