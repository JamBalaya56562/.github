name: Terraform Autofix

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing the OpenTofu configuration."
        type: string
        required: false
        default: infra/github-org
      tofu_version:
        description: "OpenTofu version to install."
        type: string
        required: false
        default: "latest"
      commit_message:
        description: "Commit message used when pushing fmt fixes back to the PR."
        type: string
        required: false
        default: "chore(tofu): auto-fix formatting"

permissions:
  contents: write
  pull-requests: read

jobs:
  autofix:
    name: OpenTofu Autofix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.TF_TOKEN_GITHUB }}
          persist-credentials: true
          allow-unsafe-pr-checkout: true

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.tofu_version }}
          tofu_wrapper: false

      - name: Tofu Format
        run: tofu fmt -recursive

      - name: Commit and push fixes
        working-directory: ${{ github.workspace }}
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "${COMMIT_MESSAGE}"
          git push origin "HEAD:${PR_HEAD_REF}"
