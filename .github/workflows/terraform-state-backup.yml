name: Terraform State Backup

# Reusable: back up one module's state artifact to a GitHub Release asset
# and renew the artifact itself. Artifacts expire after at most 90 days,
# so a module whose apply stays quiet for a quarter would otherwise lose
# its state entirely; re-uploading here rolls that window forward on every
# run.
#
# Callers own the triggers. `workflow_run` in particular cannot live here:
# it fires in the repo where the completed workflow ran, not in the
# reusable workflow's home repo.

on:
  workflow_call:
    inputs:
      state_artifact_name:
        description: "Name of the GitHub Actions artifact storing the tofu state. Matches the value the module's apply uses."
        type: string
        required: false
        default: terraform-state
      state_run_id_variable:
        description: "Name of the repo variable holding the run-id whose artifact carries this module's state."
        type: string
        required: false
        default: LATEST_APPLY_RUN_ID
      module_label:
        description: "Short module name used to namespace release tags and asset filenames. Leave empty in a repo with a single module."
        type: string
        required: false
        default: ""
      working_directory:
        description: "Directory the restore instructions in the release notes point at."
        type: string
        required: false
        default: infra/github
      keep_backups:
        description: "How many releases to keep for this module."
        type: number
        required: false
        default: 12
    secrets:
      TF_TOKEN_GITHUB:
        description: "PAT with variables:write, used to move the run-id variable to this run. The automatic GITHUB_TOKEN cannot write repo variables."
        required: true

permissions:
  contents: write # Required to create releases.
  actions: write  # Required to read the state artifact and re-upload it.

# Same key the apply and seed workflows use, so a backup never runs while
# this module's state is being written.
concurrency:
  group: ${{ inputs.state_artifact_name }}
  cancel-in-progress: false

jobs:
  backup:
    name: Backup state to release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the run holding the state
        id: source
        env:
          RUN_ID: ${{ vars[inputs.state_run_id_variable] }}
          VARIABLE: ${{ inputs.state_run_id_variable }}
          LABEL: ${{ inputs.module_label }}
        run: |
          set -euo pipefail
          if [ -z "${RUN_ID}" ]; then
            echo "::error::${VARIABLE} is unset, so there is no state to back up${LABEL:+ for ${LABEL}}. Run the apply, or seed the state first."
            exit 1
          fi
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "prefix=state-backup-${LABEL:+${LABEL}-}" >> "$GITHUB_OUTPUT"
          echo "asset_stem=terraform-${LABEL:+${LABEL}-}" >> "$GITHUB_OUTPUT"

      - name: Download state artifact
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.state_artifact_name }}
          path: ./state-backup/
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report the missing artifact and stop
        if: steps.artifact.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFIX: ${{ steps.source.outputs.prefix }}
          ARTIFACT: ${{ inputs.state_artifact_name }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 \
            --json tagName,isPrerelease \
            --jq --arg p "${PREFIX}" \
            '[.[] | select(.isPrerelease and (.tagName | startswith($p)))][0].tagName')"
          echo "::error::The ${ARTIFACT} artifact for run ${RUN_ID} could not be downloaded, so this run cannot publish a backup or renew the artifact. Newest release backup: ${tag:-none}. Restore it with the Seed Terraform State workflow, then re-run this one."
          exit 1

      - name: Verify the state is usable
        id: check
        run: |
          if [ ! -f ./state-backup/terraform.tfstate ]; then
            echo "::error::Expected ./state-backup/terraform.tfstate after artifact download but the file is missing."
            exit 1
          fi
          if ! jq -e '.resources | length > 0' ./state-backup/terraform.tfstate >/dev/null 2>&1; then
            echo "::error::State has no resources. Refusing to publish it as a backup or renew the artifact from it."
            exit 1
          fi
          echo "state_size=$(stat -c%s ./state-backup/terraform.tfstate)" >> $GITHUB_OUTPUT

      - name: Generate timestamp
        id: timestamp
        env:
          PREFIX: ${{ steps.source.outputs.prefix }}
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "datetime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "tag=${PREFIX}$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Copy state file under its timestamped name
        env:
          STEM: ${{ steps.source.outputs.asset_stem }}
          DATE: ${{ steps.timestamp.outputs.date }}
        run: |
          cp ./state-backup/terraform.tfstate "./state-backup/${STEM}${DATE}.tfstate"

      - name: Create Release with state backup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.timestamp.outputs.tag }}
          DATE: ${{ steps.timestamp.outputs.date }}
          DATETIME: ${{ steps.timestamp.outputs.datetime }}
          SIZE: ${{ steps.check.outputs.state_size }}
          EVENT: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
          STEM: ${{ steps.source.outputs.asset_stem }}
          LABEL: ${{ inputs.module_label }}
          MODULE_DIR: ${{ inputs.working_directory }}
        run: |
          cat > release_notes.md <<NOTES
          Automated Terraform state backup for \`${MODULE_DIR}\`.

          - **Timestamp**: ${DATETIME}
          - **Size**: ${SIZE} bytes
          - **Triggered by**: ${EVENT}
          - **Commit**: ${COMMIT}

          ## Restore Instructions

          \`\`\`bash
          gh release download ${TAG} --repo ${GITHUB_REPOSITORY} --pattern '*.tfstate'
          mv ${STEM}*.tfstate ${MODULE_DIR}/terraform.tfstate
          cd ${MODULE_DIR}/
          tofu state list
          \`\`\`

          > ⚠️ This state file may contain sensitive data.
          > Release visibility follows the repository visibility.
          NOTES

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            "./state-backup/${STEM}${DATE}.tfstate" \
            --title "State Backup${LABEL:+ ${LABEL}} ${DATE}" \
            --notes-file release_notes.md \
            --prerelease

      - name: Renew the state artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.state_artifact_name }}
          path: ./state-backup/terraform.tfstate
          retention-days: 90
          overwrite: true

      - name: Point the run-id variable at this run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          VARIABLE: ${{ inputs.state_run_id_variable }}
        with:
          github-token: ${{ secrets.TF_TOKEN_GITHUB }}
          script: |
            const name = process.env.VARIABLE;
            const expected = process.env.SOURCE_RUN_ID;
            const { data } = await github.rest.actions.getRepoVariable({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name,
            });
            if (data.value !== expected) {
              core.warning(
                `${name} moved to ${data.value} while this run was reading ${expected}; ` +
                  'a newer apply owns the state, so the artifact lease is left alone.',
              );
              return;
            }
            await github.rest.actions.updateRepoVariable({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name,
              value: `${context.runId}`,
            });

      - name: Cleanup old backups
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREFIX: ${{ steps.source.outputs.prefix }}
          KEEP: ${{ inputs.keep_backups }}
        with:
          script: |
            const prefix = process.env.PREFIX;
            const keep = Number(process.env.KEEP);
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );

            const backups = releases
              .filter(r => r.tag_name.startsWith(prefix) && r.prerelease)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            for (const release of backups.slice(keep)) {
              console.log(`Deleting old backup: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
              } catch (e) {
                console.log(`Failed to delete tag ${release.tag_name}: ${e.message}`);
              }
            }

            console.log(`Cleanup complete. Kept ${Math.min(backups.length, keep)} backups for ${prefix}.`);
