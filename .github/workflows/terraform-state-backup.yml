name: Terraform State Backup

# Back up each module's state artifact to a GitHub Release asset and renew
# the artifact itself. Artifacts expire after at most 90 days, so a module
# whose apply stays quiet for a quarter would otherwise lose its state
# entirely; re-uploading here rolls that window forward every week.
#
# The `workflow_run` listener stays per-repo (it cannot live in a reusable
# workflow — workflow_run fires in the repo where the completed workflow
# ran, not in the reusable workflow's home repo).

on:
  # Weekly backup (every Monday 03:00 UTC = 12:00 JST).
  schedule:
    - cron: '0 3 * * 1'

  # Also back up after an apply lands, for either module.
  workflow_run:
    workflows:
      - "Org Terraform Apply"
      - "Dotgithub Terraform Apply"
    types:
      - completed

  # Manual run.
  workflow_dispatch:

permissions:
  contents: write # Required to create releases.
  actions: write  # Required to read artifacts and re-upload the renewed one.

jobs:
  backup:
    name: Backup ${{ matrix.root }} state
    runs-on: ubuntu-latest
    # Skip on forks. The schedule trigger fires in any fork that has
    # Actions enabled, but forks have no state artifact to back up and lack
    # the variables/permissions the upstream backup relies on. Combined
    # with the workflow_run-success gate so a workflow_run from a failed
    # apply never produces a release.
    if: |
      github.repository_owner == 'aletheia-works' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')

    strategy:
      fail-fast: false
      matrix:
        include:
          - root: github-org
            artifact: terraform-state
            variable: LATEST_APPLY_RUN_ID
          - root: dotgithub
            artifact: terraform-state-dotgithub
            variable: LATEST_APPLY_RUN_ID_DOTGITHUB

    # Same key the reusable apply and seed-state use, so a backup never
    # runs while its module's state is being written.
    concurrency:
      group: ${{ matrix.artifact }}
      cancel-in-progress: false

    steps:
      - name: Resolve the run holding the state
        id: source
        env:
          RUN_ID: ${{ vars[matrix.variable] }}
        run: |
          if [ -z "${RUN_ID}" ]; then
            echo "::error::${{ matrix.variable }} is unset, so there is no state to back up for ${{ matrix.root }}. Run the apply, or seed the state first."
            exit 1
          fi
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Download state artifact
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ./state-backup/
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report the missing artifact and stop
        if: steps.artifact.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOT: ${{ matrix.root }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 \
            --json tagName,isPrerelease \
            --jq --arg p "state-backup-${ROOT}-" \
            '[.[] | select(.isPrerelease and (.tagName | startswith($p)))][0].tagName')"
          echo "::error::The ${{ matrix.artifact }} artifact for run ${{ steps.source.outputs.run_id }} could not be downloaded, so this run cannot publish a backup or renew the artifact. Newest release backup: ${tag:-none}. Restore it with the Seed Terraform State workflow, then re-run this one."
          exit 1

      - name: Verify the state is usable
        id: check
        run: |
          if [ ! -f ./state-backup/terraform.tfstate ]; then
            echo "::error::Expected ./state-backup/terraform.tfstate after artifact download but the file is missing."
            exit 1
          fi
          if ! jq -e '.resources | length > 0' ./state-backup/terraform.tfstate >/dev/null 2>&1; then
            echo "::error::State has no resources. Refusing to publish it as a backup or renew the artifact from it."
            exit 1
          fi
          echo "state_size=$(stat -c%s ./state-backup/terraform.tfstate)" >> $GITHUB_OUTPUT

      - name: Generate timestamp
        id: timestamp
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "datetime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "tag=state-backup-${{ matrix.root }}-$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Copy state file under its timestamped name
        run: |
          cp ./state-backup/terraform.tfstate \
             ./state-backup/terraform-${{ matrix.root }}-${{ steps.timestamp.outputs.date }}.tfstate

      - name: Create Release with state backup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.timestamp.outputs.tag }}
          DATE: ${{ steps.timestamp.outputs.date }}
          DATETIME: ${{ steps.timestamp.outputs.datetime }}
          SIZE: ${{ steps.check.outputs.state_size }}
          EVENT: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
          ROOT: ${{ matrix.root }}
        run: |
          cat > release_notes.md <<NOTES
          Automated Terraform state backup for \`infra/${ROOT}\`.

          - **Timestamp**: ${DATETIME}
          - **Size**: ${SIZE} bytes
          - **Triggered by**: ${EVENT}
          - **Commit**: ${COMMIT}

          ## Restore Instructions

          \`\`\`bash
          gh release download ${TAG} --repo ${GITHUB_REPOSITORY} --pattern '*.tfstate'
          mv terraform-${ROOT}-*.tfstate infra/${ROOT}/terraform.tfstate
          cd infra/${ROOT}/
          tofu state list
          \`\`\`

          > ⚠️ This state file may contain sensitive data.
          > Release visibility follows the repository visibility.
          NOTES

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            "./state-backup/terraform-${ROOT}-${DATE}.tfstate" \
            --title "State Backup ${ROOT} ${DATE}" \
            --notes-file release_notes.md \
            --prerelease

      - name: Renew the state artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ./state-backup/terraform.tfstate
          retention-days: 90
          overwrite: true

      - name: Point the run-id variable at this run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          VARIABLE: ${{ matrix.variable }}
        with:
          github-token: ${{ secrets.TF_TOKEN_GITHUB }}
          script: |
            const name = process.env.VARIABLE;
            const expected = process.env.SOURCE_RUN_ID;
            const { data } = await github.rest.actions.getRepoVariable({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name,
            });
            if (data.value !== expected) {
              core.warning(
                `${name} moved to ${data.value} while this run was reading ${expected}; ` +
                  'a newer apply owns the state, so the artifact lease is left alone.',
              );
              return;
            }
            await github.rest.actions.updateRepoVariable({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name,
              value: `${context.runId}`,
            });

      - name: Cleanup old backups (keep last 12 per module)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ROOT: ${{ matrix.root }}
        with:
          script: |
            const prefix = `state-backup-${process.env.ROOT}-`;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );

            const backups = releases
              .filter(r => r.tag_name.startsWith(prefix) && r.prerelease)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const toDelete = backups.slice(12);

            for (const release of toDelete) {
              console.log(`Deleting old backup: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
              } catch (e) {
                console.log(`Failed to delete tag ${release.tag_name}: ${e.message}`);
              }
            }

            console.log(`Cleanup complete. Kept ${Math.min(backups.length, 12)} ${process.env.ROOT} backups.`);
