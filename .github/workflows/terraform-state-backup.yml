name: Terraform State Backup

# Periodically back up the state artifact to GitHub Release Assets for
# long-term retention. Artifacts expire after at most 90 days on the Free
# plan, whereas Release Assets are kept indefinitely.
#
# The `workflow_run` listener stays per-repo (it cannot live in a
# reusable workflow — workflow_run fires in the repo where the completed
# workflow ran, not in the reusable workflow's home repo).

on:
  # Weekly backup (every Monday 03:00 UTC = 12:00 JST).
  schedule:
    - cron: '0 3 * * 1'

  # Also back up automatically after each successful Terraform Apply
  # (either via direct trigger or via the Org Terraform Apply caller).
  workflow_run:
    workflows:
      - "Terraform Apply"
      - "Org Terraform Apply"
    types:
      - completed

  # Manual run.
  workflow_dispatch:

permissions:
  contents: write # Required to create releases.
  actions: read   # Required to read artifacts.

concurrency:
  group: terraform-state-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup State to Release
    runs-on: ubuntu-latest
    # Skip on forks. The schedule trigger fires in any fork that has
    # Actions enabled, but forks have no terraform-state artifact to back
    # up and lack the variables/permissions the upstream backup relies on.
    # Combined with the workflow_run-success gate so a workflow_run from a
    # failed (or non-existent) apply never produces a release.
    if: |
      github.repository_owner == 'aletheia-works' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download latest state artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terraform-state
          path: ./state-backup/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check state exists
        id: check
        run: |
          if [ -f ./state-backup/terraform.tfstate ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "state_size=$(stat -c%s ./state-backup/terraform.tfstate)" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::No state file found in artifacts. Skipping backup."
          fi

      - name: Generate timestamp
        id: timestamp
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "datetime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "tag=state-backup-$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Rename state file with timestamp
        if: steps.check.outputs.exists == 'true'
        run: |
          mv ./state-backup/terraform.tfstate \
             ./state-backup/terraform-${{ steps.timestamp.outputs.date }}.tfstate

      - name: Create Release with state backup
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.timestamp.outputs.tag }}
          DATE: ${{ steps.timestamp.outputs.date }}
          DATETIME: ${{ steps.timestamp.outputs.datetime }}
          SIZE: ${{ steps.check.outputs.state_size }}
          EVENT: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
        run: |
          cat > release_notes.md <<NOTES
          Automated Terraform state backup.

          - **Timestamp**: ${DATETIME}
          - **Size**: ${SIZE} bytes
          - **Triggered by**: ${EVENT}
          - **Commit**: ${COMMIT}

          ## Restore Instructions

          \`\`\`bash
          gh release download ${TAG} --pattern '*.tfstate'
          mv terraform-*.tfstate infra/github-org/terraform.tfstate
          cd infra/github-org/
          tofu state list
          \`\`\`

          > ⚠️ This state file may contain sensitive data.
          > Release visibility follows the repository visibility.
          NOTES

          gh release create "${TAG}" \
            ./state-backup/*.tfstate \
            --title "State Backup ${DATE}" \
            --notes-file release_notes.md \
            --prerelease

      - name: Cleanup old backups (keep last 12)
        if: steps.check.outputs.exists == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const backups = releases
              .filter(r => r.tag_name.startsWith('state-backup-') && r.prerelease)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const toDelete = backups.slice(12);

            for (const release of toDelete) {
              console.log(`Deleting old backup: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
              } catch (e) {
                console.log(`Failed to delete tag ${release.tag_name}: ${e.message}`);
              }
            }

            console.log(`Cleanup complete. Kept ${Math.min(backups.length, 12)} backups.`);
