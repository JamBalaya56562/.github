# Tool versions for ad-hoc local authoring in this repo.
#
# Plan / apply / fmt for `infra/github-org/` and `infra/dotgithub/` run
# in CI (see `.github/workflows/org-terraform-*.yml` and
# `.github/workflows/dotgithub-terraform-*.yml`); both CI and this file
# track `latest` so local `tofu fmt` / `tofu validate` always matches
# what CI runs. Per-repo language runtimes (python, ruby, php, rust, …)
# live in each consumer repo's own `mise.toml` — see vivarium/mise.toml
# for the richer pin set.

[tools]
opentofu = "latest"
